name: Update Related Tools Table

on:
  schedule:
    - cron: '0 8 * * 1'     # Mondays at 08:00 UTC
  workflow_dispatch:        # "Run workflow" button

permissions:
  contents: write           # needed to commit the updated table

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Standard library only. Finds new papers citing SimBA (OpenAlex) and this week's likely
      # tool preprints (bioRxiv), keeps those whose title/abstract say they introduce a tool,
      # and adds them to misc/related_tools.csv and the Related Software page table.
      # OPENALEX_API_KEY is optional: without the secret the script pages without a key.
      # GITHUB_TOKEN (provided by Actions) raises the rate limit for the stars / last-update lookups.
      - name: Find and add new tools
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash   # -o pipefail, so a failing script is not hidden by tee
        run: python misc/related_tools_update.py auto | tee "$RUNNER_TEMP/related_tools.log"

      # Refreshes GitHub stars and last-update dates of the curated tools (the "no updates since" tags).
      - name: Refresh GitHub activity of the curated tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: python misc/related_software_activity.py | tee -a "$RUNNER_TEMP/related_tools.log"

      # Lists tools newly added to OpenBehavior, the Home Cage Monitoring Catalogue and Open Neuroscience that are not on the page yet.
      - name: Check other tool catalogues for new entries
        shell: bash
        run: python misc/related_catalogues_update.py | tee -a "$RUNNER_TEMP/related_tools.log"

      - name: Rebuild the Related Software table
        shell: bash
        run: python misc/related_tools_table.py | tee -a "$RUNNER_TEMP/related_tools.log"

      - name: Configure Git
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"

      - name: Commit updated table (if changed)
        run: |
          git add misc/related_tools.csv misc/related_tools_seen.csv misc/related_software.csv \
                  docs/_generated/related_tools_table.html docs/_generated/related_tools_index.rst \
                  misc/related_catalogues_seen.csv docs/_generated/related_catalogues_new.html
          git commit -m "Update related tools table" || echo "Nothing to commit"
          git push

      # Fails the run (GitHub emails a failure notice) if the table no longer renders: the RST
      # directive got broken, or the live Read the Docs page lost the table.
      - name: Check the table renders on the Related Software page
        shell: bash
        run: |
          pip install --quiet docutils
          python misc/check_related_tools_page.py | tee -a "$RUNNER_TEMP/related_tools.log"

      # Shown on the run's page under the Actions tab. Never opens GitHub issues.
      - name: Show the run's additions in the job summary
        if: always()
        continue-on-error: true
        run: |
          [ -s "$RUNNER_TEMP/related_tools.log" ] || exit 0
          { echo '```'; cat "$RUNNER_TEMP/related_tools.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
