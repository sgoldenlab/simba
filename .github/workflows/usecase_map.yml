name: Update SimBA Use-Case Map

on:
  schedule:
    - cron: '30 7 * * *'   # daily at 07:30 UTC (just after the download-stats job)
  workflow_dispatch:        # "Run workflow" button — click after editing the sheet

permissions:
  contents: write           # needed to commit the regenerated HTML

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # No pip install and no secrets needed — the generator uses only the
      # Python standard library and reads the public Google Sheet as CSV.
      #
      # This job supplies only the sheet half of the page. The corpus panels
      # (behaviours, brain regions, methods, diseases, word cloud) come from the
      # committed misc/corpus_stats.json, mined from the paper PDFs — which live
      # locally and cannot be committed, so this job never regenerates them. That
      # refresh runs from the machine holding the PDFs, via the bi-weekly
      # misc/hooks/pre-push hook (install: python misc/install_hooks.py).
      # Institutions new to the sheet are geocoded, and country spellings no list recognises
      # are looked up once (OpenStreetMap Nominatim), so they show up on the pages today.
      # Anything placed or left unresolved goes in a report, shown in the run's job summary below.
      - name: Resolve new institutions and country spellings
        run: python misc/resolve_new_places.py --report "$RUNNER_TEMP/places.md"

      - name: Regenerate use-case map from the public sheet
        run: python misc/usecase_map_stats.py

      - name: Regenerate searchable studies table from the public sheet
        run: python misc/usecase_table.py

      - name: Regenerate the studies globe from the public sheet
        run: python misc/usecase_globe.py

      - name: Configure Git
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"

      - name: Commit updated map (if changed)
        run: |
          git add docs/_generated/usecase_map.html docs/_generated/usecase_table.html docs/_generated/usecase_globe.html
          git add misc/institution_coords.py misc/geocode_cache.json misc/country_auto.json misc/places_reported.json
          git commit -m "Update SimBA use-case global-reach map" || echo "Nothing to commit"
          git push

      # Shown on the run's page under the Actions tab. Never opens GitHub issues.
      - name: Show places to review in the job summary
        if: always()
        continue-on-error: true
        run: |
          [ -s "$RUNNER_TEMP/places.md" ] || { echo "No new places to review"; exit 0; }
          cat "$RUNNER_TEMP/places.md" >> "$GITHUB_STEP_SUMMARY"
