# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: py3.10 tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    # Runs inside the official Python 3.10 image, like the py3.6 job: system packages then come from Debian's mirrors.
    # Ubuntu's mirror for GitHub's own runners (azure.archive.ubuntu.com) can stop responding for hours, which
    # stalled FFmpeg installs on those runners.
    runs-on: ubuntu-latest
    container: python:3.10-bookworm
    timeout-minutes: 45       # a hung step fails within minutes instead of GitHub's 6-hour default

    steps:
    - uses: actions/checkout@v4
    - name: Install ffmpeg and OpenCV system libraries
      timeout-minutes: 10
      run: |
        apt-get -o Acquire::Retries=3 update
        apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0
        ffmpeg -version
    - name: Install dependencies
      run: |
        python -m pip install pip==21.2.2
        pip install --upgrade setuptools
        pip install flake8 pytest black pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install --no-deps .   # this commit's code, not the release on PyPI
    - name: Test with pytest
      # Run from the repository root: the tests use paths such as tests/data/...
      # -p no:dash: the pinned dash 1.14 registers a pytest plugin that fails to import with current werkzeug.
      run: |
        python -m pytest tests -p no:dash
