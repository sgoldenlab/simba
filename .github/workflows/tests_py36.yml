# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: py3.6 tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    # ubuntu-20.04 was retired by GitHub, and actions/setup-python has no Python 3.6 for newer
    # Ubuntu images, so the job runs inside the official Python 3.6 image instead.
    runs-on: ubuntu-latest
    container: python:3.6.15-bullseye
    timeout-minutes: 45       # a hung step fails within minutes instead of GitHub's 6-hour default

    steps:
    - uses: actions/checkout@v4
    - name: Install ffmpeg and OpenCV system libraries
      # Debian 11's security repository has been archived (its packages now return 404), so
      # install from the main bullseye repository only.
      run: |
        sed -i '/security/d' /etc/apt/sources.list
        apt-get update
        apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0
        ffmpeg -version
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade setuptools
        pip install flake8 pytest black pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install --no-deps .   # this commit's code, not the release on PyPI
    - name: Test with pytest
      # Run from the repository root: the tests use paths such as tests/data/...
      run: |
        python -m pytest tests
